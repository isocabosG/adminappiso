    <script>
      /* Tema claro/oscuro POR DISPOSITIVO. Corre antes de la app y del shim de storage,
         capturando el localStorage real para que la preferencia sea local (no compartida). */
      (function () {
        var LS = null; try { LS = window.localStorage; } catch (e) {}
        var saved = null; try { saved = LS && LS.getItem("iso-theme"); } catch (e) {}
        if (saved === "dark") document.documentElement.classList.add("dark");
        window.__isoTheme = {
          get: function () { return document.documentElement.classList.contains("dark"); },
          toggle: function () {
            var el = document.documentElement; el.classList.toggle("dark");
            var on = el.classList.contains("dark");
            try { LS && LS.setItem("iso-theme", on ? "dark" : "light"); } catch (e) {}
            return on;
          }
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
